<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>LangLink – Dashboard</title>
    <style>
        :root{
            --bg:#fff7ef;--card:#ffffff;--text:#1f2937;--muted:#6b7280;
            --border:#f1d2b7;--shadow:0 10px 30px rgba(31,41,55,.10);
            --orange:#f97316;--orange2:#fb923c;--danger:#b91c1c;--ok:#047857;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
            background:radial-gradient(1200px 600px at 15% 0%,rgba(249,115,22,.18),transparent 60%),
            radial-gradient(1000px 600px at 90% 10%,rgba(251,146,60,.14),transparent 55%),
            var(--bg);
            color:var(--text);
        }
        header{
            padding:20px 24px 12px;max-width:1140px;margin:0 auto;
            display:flex;align-items:center;justify-content:space-between;gap:12px;
        }
        .brand{display:flex;align-items:center;gap:12px;}
        .logo{
            width:42px;height:42px;border-radius:12px;
            background:linear-gradient(135deg,var(--orange),var(--orange2));
            box-shadow:0 10px 24px rgba(249,115,22,.25);flex-shrink:0;
        }
        .brand h1{margin:0;font-size:26px;}
        .brand p{margin:2px 0 0;color:var(--muted);font-size:13px;}
        .header-right{display:flex;align-items:center;gap:10px;}
        .user-pill{
            padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.7);
            border:1px solid var(--border);font-size:13px;color:var(--text);backdrop-filter:blur(6px);
        }
        button.btn-logout{
            padding:8px 14px;border-radius:999px;border:1px solid var(--border);
            background:transparent;cursor:pointer;font-size:13px;color:var(--muted);
        }
        button.btn-logout:hover{background:rgba(185,28,28,.06);color:var(--danger);border-color:#fecaca;}

        .main{
            max-width:1140px;margin:0 auto;padding:0 20px 48px;
            display:grid;grid-template-columns:340px 1fr;gap:18px;
        }
        @media(max-width:920px){.main{grid-template-columns:1fr;}}

        .card{
            background:var(--card);border:1px solid var(--border);
            border-radius:18px;box-shadow:var(--shadow);padding:20px;
        }
        .card h2{margin:0 0 4px;font-size:17px;}
        .card .sub{margin:0 0 14px;color:var(--muted);font-size:12px;}
        .divider{height:1px;background:rgba(241,210,183,.8);margin:16px 0;}

        label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;margin-top:12px;}
        input,select,textarea{
            width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);
            outline:none;font-size:13px;background:#fff;font-family:inherit;
        }
        textarea{resize:vertical;min-height:70px;}
        input:focus,select:focus,textarea:focus{
            border-color:rgba(249,115,22,.65);box-shadow:0 0 0 3px rgba(249,115,22,.12);
        }
        .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        @media(max-width:480px){.grid2{grid-template-columns:1fr;}}

        button.btn-primary{
            padding:10px 16px;border:0;cursor:pointer;border-radius:11px;
            font-weight:700;font-size:13px;
            background:linear-gradient(135deg,var(--orange),var(--orange2));
            color:white;box-shadow:0 6px 16px rgba(249,115,22,.20);
        }
        button.btn-ghost{
            padding:10px 14px;border:1px solid var(--border);cursor:pointer;
            border-radius:11px;font-size:13px;background:transparent;color:var(--text);
        }
        button.btn-sm{
            padding:7px 12px;border:0;cursor:pointer;border-radius:9px;
            font-weight:700;font-size:12px;
            background:linear-gradient(135deg,var(--orange),var(--orange2));
            color:white;
        }
        .status{margin-top:8px;font-size:12px;color:var(--muted);min-height:16px;}
        .status.ok{color:var(--ok);font-weight:700;}
        .status.err{color:var(--danger);}

        /* Profile display */
        .profile-display{font-size:14px;line-height:1.7;}
        .profile-display .pname{font-size:20px;font-weight:700;margin-bottom:2px;}
        .profile-display .lang-badge{
            display:inline-block;margin:4px 4px 0 0;padding:4px 10px;border-radius:999px;
            background:rgba(249,115,22,.10);border:1px solid rgba(249,115,22,.25);
            font-size:12px;color:var(--orange);font-weight:600;
        }
        .profile-display .bio{margin-top:8px;color:var(--muted);font-size:13px;}
        .profile-display .loc{color:var(--muted);font-size:12px;margin-top:4px;}

        /* Match cards */
        .match-grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;
            margin-top:12px;
        }
        .match-card{
            background:rgba(255,255,255,.85);border:1px solid var(--border);
            border-radius:14px;padding:14px;
            box-shadow:0 4px 12px rgba(31,41,55,.06);
        }
        .match-card .mname{font-weight:700;font-size:15px;margin-bottom:4px;}
        .match-card .mloc{font-size:12px;color:var(--muted);margin-bottom:6px;}
        .match-card .mbio{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.4;}
        .match-card .lang-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}

        /* Chat */
        .chatBox{
            border:1px solid var(--border);border-radius:13px;padding:10px;
            background:rgba(255,255,255,.7);height:240px;overflow:auto;
        }
        .msg{display:flex;margin:7px 0;gap:7px;align-items:flex-end;}
        .bubble{
            max-width:78%;padding:9px 12px;border-radius:13px;
            border:1px solid var(--border);background:#fff;font-size:13px;line-height:1.35;
        }
        .mine .bubble{
            background:rgba(249,115,22,.10);border-color:rgba(249,115,22,.35);margin-left:auto;
        }
        .meta{font-size:11px;color:var(--muted);white-space:nowrap;}
        .mine .meta{margin-left:auto;}
        .chat-input-row{display:flex;gap:8px;margin-top:10px;align-items:flex-end;}
        .chat-input-row input{flex:1;}

        /* Loading */
        #loadingOverlay{
            position:fixed;inset:0;background:var(--bg);display:flex;
            align-items:center;justify-content:center;z-index:999;
            font-size:15px;color:var(--muted);
        }
    </style>
</head>
<body>

<div id="loadingOverlay">Loading LangLink…</div>

<header>
    <div class="brand">
        <div class="logo"></div>
        <div>
            <h1>LangLink</h1>
            <p>Meet people to practise languages nearby</p>
        </div>
    </div>
    <div class="header-right">
        <span class="user-pill" id="headerName">–</span>
        <button class="btn-logout" id="logoutBtn">Sign out</button>
    </div>
</header>

<div class="main">
    <!-- ─── LEFT COLUMN ─────────────────────────────────────────── -->
    <div style="display:flex;flex-direction:column;gap:18px;">

        <!-- My Profile -->
        <div class="card" id="profileCard">
            <h2>My Profile</h2>
            <p class="sub">This is how other users see you.</p>
            <div id="profileDisplay" class="profile-display">Loading…</div>
            <div class="divider"></div>
            <details id="editDetails">
                <summary style="cursor:pointer;font-size:13px;color:var(--orange);font-weight:700;">Edit profile</summary>
                <div class="grid2" style="margin-top:12px;">
                    <div>
                        <label>Name</label>
                        <input id="editName"/>
                    </div>
                    <div>
                        <label>Area / City</label>
                        <input id="editLocation" placeholder="e.g. Leicester"/>
                    </div>
                    <div>
                        <label>Native language</label>
                        <input id="editNative"/>
                    </div>
                    <div>
                        <label>Learning</label>
                        <input id="editTarget"/>
                    </div>
                </div>
                <div>
                    <label>Proficiency</label>
                    <select id="editProficiency">
                        <option value="">– Select –</option>
                        <option>Beginner</option>
                        <option>Elementary</option>
                        <option>Intermediate</option>
                        <option>Upper-Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </div>
                <div>
                    <label>About me</label>
                    <textarea id="editBio" placeholder="A short bio…"></textarea>
                </div>
                <div class="row">
                    <button class="btn-primary" id="saveProfileBtn">Save changes</button>
                </div>
                <div class="status" id="profileStatus"></div>
            </details>
        </div>

        <!-- Chat (left panel) -->
        <div class="card">
            <h2>Chat</h2>
            <p class="sub">Select a match to open the conversation.</p>
            <div id="chatHeader" style="font-size:13px;color:var(--muted);margin-bottom:8px;">No conversation open.</div>
            <div class="chatBox" id="chatBox"></div>
            <div class="status" id="chatStatus"></div>
            <div class="chat-input-row">
                <input id="chatMessage" placeholder="Type a message…"/>
                <button class="btn-primary" id="sendChatBtn">Send</button>
            </div>
        </div>

    </div>

    <!-- ─── RIGHT COLUMN ────────────────────────────────────────── -->
    <div class="card">
        <h2>Find Matches</h2>
        <p class="sub">People who speak your target language and want to learn yours.</p>
        <div class="row">
            <div style="flex:1;min-width:160px;">
                <label>Filter by area <span style="font-weight:normal">(optional)</span></label>
                <input id="locationFilter" placeholder="e.g. Leicester"/>
            </div>
            <button class="btn-primary" id="findMatchesBtn">Find matches</button>
            <button class="btn-ghost" id="clearMatchesBtn">Clear</button>
        </div>
        <div class="status" id="matchesStatus"></div>
        <div class="match-grid" id="matchGrid"></div>
    </div>
</div>

<script>
    // ── State ─────────────────────────────────────────────────────────
    let me = null; // logged-in user object
    let chatPartnerId = null;
    let chatPartnerName = '';

    // ── Helpers ───────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    function safeText(s){ return (s == null) ? '' : String(s); }

    function fmtTime(iso){
        try {
            const d = new Date(iso);
            return isNaN(d) ? '' : d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        } catch(_){ return ''; }
    }

    async function apiFetch(url, opts={}){
        const res = await fetch(url, opts);
        if (res.status === 401) { window.location.href = '/login.html'; return null; }
        return res;
    }

    // ── Boot: check session ───────────────────────────────────────────
    async function init() {
        try {
            const res = await fetch('/auth/me');
            if (!res.ok) {
                window.location.href = '/login.html';
                return;
            }
            me = await res.json();
            $('headerName').textContent = me.name || me.email;
            renderProfileDisplay();
            $('loadingOverlay').style.display = 'none';
        } catch(e) {
            window.location.href = '/login.html';
        }
    }

    // ── Profile display ───────────────────────────────────────────────
    function renderProfileDisplay(){
        const el = $('profileDisplay');
        el.innerHTML = `
    <div class="pname">${safeText(me.name)}</div>
    <span class="lang-badge">Speaks ${safeText(me.nativeLanguage)||'–'}</span>
    <span class="lang-badge">Learning ${safeText(me.targetLanguage)||'–'}</span>
    ${me.proficiency ? `<span class="lang-badge">${safeText(me.proficiency)}</span>` : ''}
    ${me.location ? `<div class="loc">📍 ${safeText(me.location)}</div>` : ''}
    ${me.bio ? `<div class="bio">${safeText(me.bio)}</div>` : ''}
  `;
        // Pre-fill edit fields
        $('editName').value = safeText(me.name);
        $('editNative').value = safeText(me.nativeLanguage);
        $('editTarget').value = safeText(me.targetLanguage);
        $('editLocation').value = safeText(me.location);
        $('editBio').value = safeText(me.bio);
        $('editProficiency').value = safeText(me.proficiency);
    }

    // ── Save profile ──────────────────────────────────────────────────
    $('saveProfileBtn').addEventListener('click', async () => {
        const st = $('profileStatus');
        st.textContent = ''; st.className = 'status';
        const payload = {
            name: $('editName').value.trim(),
            nativeLanguage: $('editNative').value.trim(),
            targetLanguage: $('editTarget').value.trim(),
            location: $('editLocation').value.trim(),
            bio: $('editBio').value.trim(),
            proficiency: $('editProficiency').value
        };
        if (!payload.name){ st.textContent='Name cannot be empty.'; st.className='status err'; return; }
        try {
            const res = await apiFetch('/users/me', {
                method:'PUT', headers:{'Content-Type':'application/json'},
                body: JSON.stringify(payload)
            });
            if (!res || !res.ok) {
                const d = res ? await res.json().catch(()=>({})) : {};
                st.textContent = d.error || 'Save failed.'; st.className='status err'; return;
            }
            me = await res.json();
            $('headerName').textContent = me.name || me.email;
            renderProfileDisplay();
            st.textContent = 'Profile saved.'; st.className='status ok';
            $('editDetails').removeAttribute('open');
        } catch(e) {
            st.textContent = 'Could not save. Please try again.'; st.className='status err';
        }
    });

    // ── Logout ────────────────────────────────────────────────────────
    $('logoutBtn').addEventListener('click', async () => {
        await fetch('/auth/logout', {method:'POST'});
        window.location.href = '/login.html';
    });

    // ── Find matches ──────────────────────────────────────────────────
    $('findMatchesBtn').addEventListener('click', async () => {
        const st = $('matchesStatus');
        const grid = $('matchGrid');
        st.textContent = 'Searching…'; st.className = 'status';
        grid.innerHTML = '';
        const locationFilter = $('locationFilter').value.trim();
        const url = locationFilter ? `/users/me/matches?location=${encodeURIComponent(locationFilter)}` : '/users/me/matches';
        try {
            const res = await apiFetch(url);
            if (!res) return;
            const matches = await res.json();
            if (!res.ok) {
                st.textContent = matches.error || 'Could not load matches.'; st.className='status err'; return;
            }
            if (!matches.length){
                st.textContent = locationFilter
                    ? 'No matches found in that area. Try broadening your search or leave the area field blank.'
                    : 'No matches yet — you will appear when someone with the opposite language pairing signs up.';
                return;
            }
            matches.forEach(u => grid.appendChild(buildMatchCard(u)));
            st.textContent = `Found ${matches.length} match${matches.length===1?'':'es'}.`;
            st.className = 'status ok';
        } catch(e) {
            st.textContent = 'Search failed. Please try again.'; st.className='status err';
        }
    });

    $('clearMatchesBtn').addEventListener('click', () => {
        $('matchGrid').innerHTML = '';
        $('matchesStatus').textContent = '';
        $('matchesStatus').className = 'status';
    });

    function buildMatchCard(u){
        const card = document.createElement('div');
        card.className = 'match-card';
        const bio = safeText(u.bio);
        const loc = safeText(u.location);
        const prof = safeText(u.proficiency);
        card.innerHTML = `
    <div class="mname">${safeText(u.name)||'User'}</div>
    ${loc ? `<div class="mloc">📍 ${loc}</div>` : ''}
    <div class="lang-row">
      <span class="lang-badge">Speaks ${safeText(u.nativeLanguage)||'–'}</span>
      <span class="lang-badge">Learning ${safeText(u.targetLanguage)||'–'}</span>
      ${prof ? `<span class="lang-badge">${prof}</span>` : ''}
    </div>
    ${bio ? `<div class="mbio">${bio.length>100?bio.slice(0,100)+'…':bio}</div>` : ''}
    <button class="btn-sm start-chat-btn" data-id="${u.id}" data-name="${safeText(u.name)}">
      Message ${safeText(u.name)||'them'}
    </button>
  `;
        card.querySelector('.start-chat-btn').addEventListener('click', () => {
            openChat(u.id, u.name);
        });
        return card;
    }

    // ── Chat ──────────────────────────────────────────────────────────
    function openChat(partnerId, partnerName){
        chatPartnerId = partnerId;
        chatPartnerName = partnerName || `User ${partnerId}`;
        $('chatHeader').textContent = `Conversation with ${chatPartnerName}`;
        $('chatHeader').style.color = 'var(--orange)';
        loadConversation();
    }

    async function loadConversation(){
        if (!chatPartnerId) return;
        $('chatStatus').textContent = ''; $('chatStatus').className = 'status';
        $('chatBox').innerHTML = '';
        try {
            const res = await apiFetch(`/chat/conversation?withUserId=${chatPartnerId}`);
            if (!res) return;
            const messages = await res.json();
            if (!res.ok){ $('chatStatus').textContent = messages.error||'Load failed.'; return; }
            if (!messages.length){ $('chatStatus').textContent = 'No messages yet. Say hello!'; return; }
            messages.forEach(m => $('chatBox').appendChild(buildMessageEl(m)));
            $('chatBox').scrollTop = $('chatBox').scrollHeight;
        } catch(e){
            $('chatStatus').textContent = 'Could not load messages.'; $('chatStatus').className='status err';
        }
    }

    function buildMessageEl(m){
        const mine = Number(m.fromUserId) === Number(me.id);
        const wrapper = document.createElement('div');
        wrapper.className = 'msg ' + (mine ? 'mine' : 'theirs');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = safeText(m.content);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = fmtTime(m.createdAt);
        if (mine){ wrapper.appendChild(meta); wrapper.appendChild(bubble); }
        else { wrapper.appendChild(bubble); wrapper.appendChild(meta); }
        return wrapper;
    }

    $('sendChatBtn').addEventListener('click', sendMessage);
    $('chatMessage').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); sendMessage(); }});

    async function sendMessage(){
        const st = $('chatStatus');
        st.textContent = ''; st.className = 'status';
        if (!chatPartnerId){ st.textContent='Select a match to chat with.'; st.className='status err'; return; }
        const text = $('chatMessage').value.trim();
        if (!text){ st.textContent='Type a message first.'; st.className='status err'; return; }
        try {
            const res = await apiFetch('/chat/send', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ toUserId: chatPartnerId, content: text })
            });
            if (!res) return;
            const data = await res.json();
            if (!res.ok){ st.textContent = data.error||'Send failed.'; st.className='status err'; return; }
            $('chatMessage').value = '';
            await loadConversation();
        } catch(e){
            st.textContent = 'Send failed.'; st.className='status err';
        }
    }

    init();
</script>
</body>
</html>
