<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>LangLink – Sign In</title>
    <style>
        :root{
            --bg:#fff7ef; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
            --border:#f1d2b7; --orange:#f97316; --orange2:#fb923c;
            --danger:#b91c1c; --ok:#047857;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
            background: radial-gradient(1200px 600px at 15% 0%,rgba(249,115,22,.18),transparent 60%),
            radial-gradient(1000px 600px at 90% 10%,rgba(251,146,60,.14),transparent 55%),
            var(--bg);
            color:var(--text);
            min-height:100vh;
            display:flex;align-items:center;justify-content:center;
        }
        .wrap{width:100%;max-width:420px;padding:20px;}
        .brand{text-align:center;margin-bottom:28px;}
        .logo{
            width:52px;height:52px;border-radius:14px;margin:0 auto 12px;
            background:linear-gradient(135deg,var(--orange),var(--orange2));
            box-shadow:0 10px 24px rgba(249,115,22,.25);
        }
        .brand h1{margin:0;font-size:28px;}
        .brand p{margin:4px 0 0;color:var(--muted);font-size:13px;}
        .card{
            background:var(--card);border:1px solid var(--border);
            border-radius:18px;box-shadow:0 10px 30px rgba(31,41,55,.10);padding:28px;
        }
        .card h2{margin:0 0 18px;font-size:20px;}
        label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;margin-top:14px;}
        input{
            width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
            outline:none;font-size:14px;background:#fff;
        }
        input:focus{border-color:rgba(249,115,22,.65);box-shadow:0 0 0 4px rgba(249,115,22,.12);}
        button.btn{
            width:100%;margin-top:20px;padding:13px;border:0;cursor:pointer;
            border-radius:12px;font-weight:700;font-size:15px;
            background:linear-gradient(135deg,var(--orange),var(--orange2));
            color:white;box-shadow:0 10px 22px rgba(249,115,22,.22);
        }
        .status{margin-top:12px;font-size:13px;color:var(--muted);min-height:18px;}
        .status.err{color:var(--danger);}
        .status.ok{color:var(--ok);font-weight:700;}
        .foot{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
        .foot a{color:var(--orange);text-decoration:none;font-weight:600;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="brand">
        <div class="logo"></div>
        <h1>LangLink</h1>
        <p>Meet people to practise languages nearby</p>
    </div>
    <div class="card">
        <h2>Sign in to your account</h2>
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="btn" id="loginBtn">Sign in</button>
        <div class="status" id="status"></div>
    </div>
    <div class="foot">
        Don't have an account? <a href="/register.html">Create one</a>
    </div>
</div>
<script>
    async function doLogin() {
        const st = document.getElementById('status');
        st.textContent = '';
        st.className = 'status';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) {
            st.textContent = 'Please enter your email and password.';
            st.className = 'status err';
            return;
        }
        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (!res.ok) {
                st.textContent = data.error || 'Login failed. Please try again.';
                st.className = 'status err';
                return;
            }
            // Redirect to dashboard
            window.location.href = '/index.html';
        } catch(e) {
            st.textContent = 'Could not connect. Please try again.';
            st.className = 'status err';
        }
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
