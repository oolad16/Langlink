# ── Supabase PostgreSQL (Session Pooler) ─────────────────────────────────────
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-2.pooler.supabase.com:5432/postgres?user=postgres.xhfunnjoqpwyfzkhdrll&password=gnW1i7yLcBLo7UiC&sslmode=require&prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── Connection pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=SELECT 1

# ── Disable H2 console ────────────────────────────────────────────────────────
spring.h2.console.enabled=false

# ── Session / App ─────────────────────────────────────────────────────────────
server.servlet.session.timeout=30m
spring.application.name=LangLink